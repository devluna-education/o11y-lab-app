# Routes all external HTTP traffic to the frontend, which proxies to the backends.
# ingressClassName defaults to Traefik (k3s). Change it for nginx, ALB, etc.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
