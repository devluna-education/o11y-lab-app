# Fallback direct access without an ingress controller: http://<node-ip>:30081
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
