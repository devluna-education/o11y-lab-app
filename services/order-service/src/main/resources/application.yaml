server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8000}
  connect-timeout: 2s
  read-timeout: 5s

# Fault injection (override with CHAOS_ERROR_RATE / CHAOS_LATENCY_MS)
chaos:
  error-rate: 0.0
  latency-ms: 0

fulfillment:
  enabled: true
  interval-ms: 10000
  step-delay: 15s

logging:
  level:
    root: INFO
    com.example.orders: INFO
